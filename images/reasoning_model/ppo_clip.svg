<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Inter, system-ui, sans-serif">
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">PPO Clipped Surrogate Objective</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#374151">Loss as a function of the policy ratio ρ_t = π_θ(a|s) / π_θ_old(a|s) for both signs of advantage</text>

  <!-- Left graph: A > 0 -->
  <g transform="translate(60,90)">
    <text x="220" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Positive advantage  Â_t &gt; 0</text>
    <text x="220" y="20" text-anchor="middle" font-size="12" fill="#374151">"action was good — push probability up"</text>
    <!-- Axes -->
    <line x1="40" y1="280" x2="440" y2="280" stroke="#111827" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="280" stroke="#111827" stroke-width="1.5"/>
    <text x="240" y="305" text-anchor="middle" font-size="13" fill="#111827">policy ratio ρ</text>
    <text x="20" y="160" text-anchor="middle" font-size="13" fill="#111827" transform="rotate(-90 20,160)">objective</text>
    <!-- ticks -->
    <line x1="160" y1="278" x2="160" y2="282" stroke="#111827"/>
    <text x="160" y="296" text-anchor="middle" font-size="11" fill="#111827">1−ε</text>
    <line x1="240" y1="278" x2="240" y2="282" stroke="#111827"/>
    <text x="240" y="296" text-anchor="middle" font-size="11" fill="#111827">1</text>
    <line x1="320" y1="278" x2="320" y2="282" stroke="#111827"/>
    <text x="320" y="296" text-anchor="middle" font-size="11" fill="#111827">1+ε</text>
    <!-- objective shape: linearly increasing then flat (clip) -->
    <line x1="40" y1="240" x2="320" y2="80" stroke="#16a34a" stroke-width="3"/>
    <line x1="320" y1="80" x2="440" y2="80" stroke="#16a34a" stroke-width="3" stroke-dasharray="0"/>
    <!-- annotations -->
    <text x="120" y="185" font-size="11" fill="#14532d">normal gradient</text>
    <text x="370" y="70" font-size="11" font-weight="700" fill="#dc2626">CLIPPED</text>
    <text x="370" y="86" font-size="11" fill="#dc2626">no gradient</text>
    <!-- vertical line at trust boundary -->
    <line x1="320" y1="80" x2="320" y2="280" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- Right graph: A < 0 -->
  <g transform="translate(620,90)">
    <text x="220" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Negative advantage  Â_t &lt; 0</text>
    <text x="220" y="20" text-anchor="middle" font-size="12" fill="#374151">"action was bad — push probability down"</text>
    <line x1="40" y1="120" x2="440" y2="120" stroke="#111827" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="280" stroke="#111827" stroke-width="1.5"/>
    <text x="240" y="305" text-anchor="middle" font-size="13" fill="#111827">policy ratio ρ</text>
    <text x="20" y="160" text-anchor="middle" font-size="13" fill="#111827" transform="rotate(-90 20,160)">objective</text>
    <!-- ticks -->
    <line x1="160" y1="118" x2="160" y2="122" stroke="#111827"/>
    <text x="160" y="138" text-anchor="middle" font-size="11" fill="#111827">1−ε</text>
    <line x1="240" y1="118" x2="240" y2="122" stroke="#111827"/>
    <text x="240" y="138" text-anchor="middle" font-size="11" fill="#111827">1</text>
    <line x1="320" y1="118" x2="320" y2="122" stroke="#111827"/>
    <text x="320" y="138" text-anchor="middle" font-size="11" fill="#111827">1+ε</text>
    <!-- shape: flat below 1-eps then linearly decreasing -->
    <line x1="40" y1="160" x2="160" y2="160" stroke="#16a34a" stroke-width="3"/>
    <line x1="160" y1="160" x2="440" y2="280" stroke="#16a34a" stroke-width="3"/>
    <!-- annotations -->
    <text x="60" y="150" font-size="11" font-weight="700" fill="#dc2626">CLIPPED</text>
    <text x="60" y="178" font-size="11" fill="#dc2626">no gradient</text>
    <text x="290" y="240" font-size="11" fill="#7f1d1d">normal gradient</text>
    <text x="290" y="255" font-size="11" fill="#7f1d1d">(suppress)</text>
    <line x1="160" y1="160" x2="160" y2="120" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <text x="550" y="425" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">Clipping kills the gradient only on the side where the policy has already moved enough — never on the corrective side</text>
</svg>
