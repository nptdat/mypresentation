<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Inter, system-ui, sans-serif">
  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Scoring candidates with sequence log-probability</text>
  <text x="550" y="53" text-anchor="middle" font-size="12" fill="#374151">Question: "Solve 2x + 3 = 11."  —  both candidates reach x = 4 but differ in format and length</text>

  <!-- ========= Candidate A panel ========= -->
  <rect x="30" y="80" width="510" height="310" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="285" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Candidate A — terse</text>
  <text x="285" y="130" text-anchor="middle" font-size="12" font-style="italic" fill="#92400e">"Answer is 4."</text>

  <!-- Tokens for A: 4 boxes at 90px spacing -->
  <!-- "Answer" -0.7 -->
  <g transform="translate(160,160)">
    <rect x="-40" y="0" width="80" height="65" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Answer</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" fill="#92400e">-0.7</text>
  </g>
  <!-- "is" -0.5 -->
  <g transform="translate(250,160)">
    <rect x="-40" y="0" width="80" height="65" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">is</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" fill="#92400e">-0.5</text>
  </g>
  <!-- "4" -1.5  (highlighted — the surprising token) -->
  <g transform="translate(340,160)">
    <rect x="-40" y="0" width="80" height="65" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">4</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">-1.5</text>
  </g>
  <!-- "." -0.3 -->
  <g transform="translate(430,160)">
    <rect x="-40" y="0" width="80" height="65" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">.</text>
    <text x="0" y="52" text-anchor="middle" font-size="12" fill="#92400e">-0.3</text>
  </g>

  <!-- Score box for A -->
  <rect x="90" y="250" width="390" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="285" y="278" text-anchor="middle" font-size="13" fill="#92400e">∑ log π = (-0.7) + (-0.5) + (-1.5) + (-0.3)</text>
  <text x="285" y="307" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">raw sum   =  -3.0</text>
  <text x="285" y="335" text-anchor="middle" font-size="13" fill="#92400e">length |y| = 4 tokens</text>
  <text x="285" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">mean      =  -0.75</text>

  <!-- ========= Candidate B panel ========= -->
  <rect x="560" y="80" width="510" height="310" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Candidate B — step-by-step CoT</text>
  <text x="815" y="130" text-anchor="middle" font-size="12" font-style="italic" fill="#14532d">"Subtract 3: 2x = 8, so x = 4."</text>

  <!-- 8 tokens for B at 55px spacing, centered -->
  <g transform="translate(625,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Sub</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.5</text>
  </g>
  <g transform="translate(680,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">tract</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.4</text>
  </g>
  <g transform="translate(735,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">3:</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.6</text>
  </g>
  <g transform="translate(790,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">2x</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.5</text>
  </g>
  <g transform="translate(845,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">= 8,</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.4</text>
  </g>
  <g transform="translate(900,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">so</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.5</text>
  </g>
  <g transform="translate(955,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">x=4</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.6</text>
  </g>
  <g transform="translate(1010,160)">
    <rect x="-25" y="0" width="50" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">.</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" fill="#14532d">-0.5</text>
  </g>

  <!-- Score box for B -->
  <rect x="620" y="250" width="390" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="815" y="278" text-anchor="middle" font-size="13" fill="#14532d">∑ log π = 8 tokens × (avg ≈ -0.5)</text>
  <text x="815" y="307" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">raw sum   =  -4.0</text>
  <text x="815" y="335" text-anchor="middle" font-size="13" fill="#14532d">length |y| = 8 tokens</text>
  <text x="815" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">mean      =  -0.50</text>

  <!-- ========= Comparison bottom ========= -->
  <rect x="30" y="410" width="1040" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="550" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Which candidate wins? Depends on the scoring rule.</text>

  <!-- Two columns of comparison -->
  <!-- Left: Raw sum -->
  <g transform="translate(70,458)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#111827">Raw sum  ∑ log π(y|x):</text>
    <text x="0" y="22" font-size="13" fill="#374151"><tspan fill="#92400e" font-weight="700">A = -3.0</tspan>   vs.   <tspan fill="#14532d" font-weight="700">B = -4.0</tspan>   →   <tspan fill="#dc2626" font-weight="700">A wins</tspan></text>
    <text x="0" y="42" font-size="11" font-style="italic" fill="#dc2626">...but only because A is shorter — every extra token makes the sum more negative.</text>
  </g>

  <!-- Right: Mean -->
  <g transform="translate(570,458)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#111827">Mean log-prob  (length-normalized):</text>
    <text x="0" y="22" font-size="13" fill="#374151"><tspan fill="#92400e" font-weight="700">A = -0.75</tspan>   vs.   <tspan fill="#14532d" font-weight="700">B = -0.50</tspan>   →   <tspan fill="#16a34a" font-weight="700">B wins</tspan></text>
    <text x="0" y="42" font-size="11" font-style="italic" fill="#16a34a">measures per-token confidence — fair across lengths, matches the intuition that B is better.</text>
  </g>

  <!-- Footer caveat -->
  <text x="550" y="560" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">Warning: log-prob ≠ correctness. A confidently wrong answer can score higher than a hesitant right one — pair with a verifier when possible.</text>
</svg>
