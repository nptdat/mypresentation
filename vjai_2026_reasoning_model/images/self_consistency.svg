<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Self-Consistency: Sample Many Reasoning Paths, Vote on the Answer</text>
  <text x="550" y="55" text-anchor="middle" font-size="13" fill="#374151">Sample N independent CoTs at temperature &gt; 0, then take the majority answer</text>

  <!-- Prompt -->
  <rect x="40" y="200" width="180" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Prompt + CoT</text>
  <text x="130" y="258" text-anchor="middle" font-size="12" fill="#92400e">Math problem,</text>
  <text x="130" y="276" text-anchor="middle" font-size="12" fill="#92400e">"think step by step"</text>

  <!-- Sampled CoTs -->
  <g>
    <rect x="290" y="90" width="260" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="305" y="110" font-size="11" fill="#1e3a8a">CoT #1: ... → \boxed{18}</text>
    <text x="305" y="130" font-size="11" fill="#1e3a8a">"5 + 6 + 7 = 18"</text>

    <rect x="290" y="170" width="260" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="305" y="190" font-size="11" fill="#1e3a8a">CoT #2: ... → \boxed{17}</text>
    <text x="305" y="210" font-size="11" fill="#1e3a8a">"alternate path, off-by-one"</text>

    <rect x="290" y="250" width="260" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="305" y="270" font-size="11" fill="#1e3a8a">CoT #3: ... → \boxed{18}</text>
    <text x="305" y="290" font-size="11" fill="#1e3a8a">"same answer, different route"</text>

    <rect x="290" y="330" width="260" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="305" y="350" font-size="11" fill="#1e3a8a">CoT #N: ... → \boxed{18}</text>
    <text x="305" y="370" font-size="11" fill="#1e3a8a">"again 18"</text>
  </g>

  <!-- arrows from prompt to CoTs -->
  <path d="M 220 245 L 290 120" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 220 250 L 290 200" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 220 260 L 290 280" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 220 270 L 290 360" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>

  <!-- Vote box -->
  <rect x="620" y="180" width="200" height="140" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Majority Vote</text>
  <text x="720" y="245" text-anchor="middle" font-size="13" fill="#5b21b6">18 → 3 votes</text>
  <text x="720" y="265" text-anchor="middle" font-size="13" fill="#5b21b6">17 → 1 vote</text>
  <text x="720" y="295" text-anchor="middle" font-size="11" font-style="italic" fill="#5b21b6">aggregate over N</text>

  <!-- arrows to vote -->
  <path d="M 550 120 L 620 220" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 550 200 L 620 240" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 550 280 L 620 260" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M 550 360 L 620 280" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>

  <!-- Final -->
  <rect x="890" y="200" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="980" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Final Answer</text>
  <text x="980" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">18</text>
  <text x="980" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#14532d">most consistent</text>

  <path d="M 820 250 L 890 250" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr3)"/>

  <!-- Bottom note -->
  <text x="550" y="445" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">Inference cost ≈ N × CoT — but accuracy improves substantially on math &amp; logic tasks</text>
</svg>
